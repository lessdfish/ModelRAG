spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  application.name: modelrag
  datasource:
    url: ${SPRING_DATASOURCE_URL:${MODELRAG_JDBC_URL:jdbc:postgresql://localhost:15432/modelrag}}
    username: ${SPRING_DATASOURCE_USERNAME:${MODELRAG_DB_USER}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MODELRAG_DB_PASSWORD}}
    hikari:
      maximum-pool-size: ${MODELRAG_DB_POOL_MAX:20}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data.redis:
    host: ${SPRING_DATA_REDIS_HOST:${MODELRAG_REDIS_HOST:localhost}}
    port: ${SPRING_DATA_REDIS_PORT:${MODELRAG_REDIS_PORT:16379}}
    connect-timeout: ${MODELRAG_REDIS_CONNECT_TIMEOUT:1s}
    timeout: ${MODELRAG_REDIS_TIMEOUT:1s}
  threads.virtual.enabled: true
  servlet.multipart.max-file-size: ${MODELRAG_MAX_FILE_SIZE:50MB}
  servlet.multipart.max-request-size: ${MODELRAG_MAX_REQUEST_SIZE:50MB}
server:
  port: ${SERVER_PORT:8091}
management.endpoints.web.exposure.include: health,info,metrics,prometheus
management.endpoint.health.probes.enabled: true
management.endpoint.health.group.readiness.include: readinessState,db,pgvector
modelrag:
  indexing.async: true
  chunk-size: 600
  chunk-overlap: 80
  inference:
    enabled: ${MODELRAG_INFERENCE_ENABLED:false}
    base-url: ${MODELRAG_INFERENCE_BASE_URL:http://127.0.0.1:18180}
    auth-token: ${MODELRAG_AI_AUTH_TOKEN:}
    connect-timeout-ms: ${MODELRAG_AI_CONNECT_TIMEOUT_MS:500}
    request-timeout-ms: ${MODELRAG_AI_REQUEST_TIMEOUT_MS:30000}
    max-concurrent-requests: ${MODELRAG_AI_MAX_CONCURRENT_REQUESTS:32}
    max-json-response-bytes: ${MODELRAG_AI_MAX_JSON_RESPONSE_BYTES:16777216}
    max-upload-bytes: ${MODELRAG_AI_MAX_UPLOAD_BYTES:52428800}
    embedding-profile: ${MODELRAG_AI_EMBEDDING_PROFILE:Qwen3-Embedding-0.6B}
    document-ai:
      enabled: ${MODELRAG_DOCUMENT_AI_ENABLED:false}
      pdf-mode: ${MODELRAG_DOCUMENT_AI_PDF_MODE:REMOTE_FIRST}
      docx-mode: ${MODELRAG_DOCUMENT_AI_DOCX_MODE:LOCAL_FIRST}
      timeout-seconds: ${MODELRAG_DOCUMENT_AI_TIMEOUT_SECONDS:120}
  index:
    v2:
      shadow-enabled: ${MODELRAG_INDEX_V2_SHADOW_ENABLED:false}
      embedding-profile: ${MODELRAG_INDEX_V2_EMBEDDING_PROFILE:qwen3-v1}
      rerank-profile: ${MODELRAG_INDEX_V2_RERANK_PROFILE:default}
      max-unit-chars: ${MODELRAG_INDEX_V2_MAX_UNIT_CHARS:4000}
      overlap-chars: ${MODELRAG_INDEX_V2_OVERLAP_CHARS:200}
      max-units-per-node: ${MODELRAG_INDEX_V2_MAX_UNITS_PER_NODE:128}
      max-units-per-build: ${MODELRAG_INDEX_V2_MAX_UNITS_PER_BUILD:100000}
      completion-poll-ms: ${MODELRAG_INDEX_V2_COMPLETION_POLL_MS:1000}
  v2-outbox:
    poll-ms: ${MODELRAG_V2_OUTBOX_POLL_MS:1000}
  qa:
    context-max-tokens: 1600
    online-ab-enabled: false
    v2:
      enabled: ${MODELRAG_QA_V2_ENABLED:false}
      max-primary-evidence: ${MODELRAG_QA_V2_MAX_PRIMARY_EVIDENCE:8}
      max-expanded-evidence: ${MODELRAG_QA_V2_MAX_EXPANDED_EVIDENCE:16}
      max-navigation-actions: ${MODELRAG_QA_V2_MAX_NAVIGATION_ACTIONS:24}
      max-table-rows: ${MODELRAG_QA_V2_MAX_TABLE_ROWS:20}
      neighbor-radius: ${MODELRAG_QA_V2_NEIGHBOR_RADIUS:1}
      min-evidence-score: ${MODELRAG_QA_V2_MIN_EVIDENCE_SCORE:0}
  search:
    rrf-vector-weight: 0.7
    rrf-bm25-weight: 0.3
    channel-timeout-ms: ${MODELRAG_SEARCH_CHANNEL_TIMEOUT_MS:800}
    rerank-timeout-ms: ${MODELRAG_SEARCH_RERANK_TIMEOUT_MS:500}
  retrieval:
    v2:
      shadow-enabled: ${MODELRAG_RETRIEVAL_V2_SHADOW_ENABLED:false}
      max-active-build-filter: ${MODELRAG_RETRIEVAL_V2_MAX_ACTIVE_BUILD_FILTER:10000}
  agent:
    max-steps: ${MODELRAG_AGENT_MAX_STEPS:6}
    deadline-ms: ${MODELRAG_AGENT_DEADLINE_MS:10000}
    legacy-non-durable-fallback: ${MODELRAG_AGENT_LEGACY_NON_DURABLE_FALLBACK:false}
    runtime:
      max-checkpoint-bytes: ${MODELRAG_AGENT_MAX_CHECKPOINT_BYTES:1048576}
      max-checkpoint-evidence: ${MODELRAG_AGENT_MAX_CHECKPOINT_EVIDENCE:32}
      max-checkpoint-observations: ${MODELRAG_AGENT_MAX_CHECKPOINT_OBSERVATIONS:20}
      max-checkpoint-excerpt-chars: ${MODELRAG_AGENT_MAX_CHECKPOINT_EXCERPT_CHARS:1000}
      lease-seconds: ${MODELRAG_AGENT_LEASE_SECONDS:30}
      recovery-poll-ms: ${MODELRAG_AGENT_RECOVERY_POLL_MS:5000}
      recovery-batch-size: ${MODELRAG_AGENT_RECOVERY_BATCH_SIZE:20}
    retrieval:
      max-search-actions: ${MODELRAG_AGENT_RETRIEVAL_MAX_SEARCH_ACTIONS:4}
      max-navigation-actions: ${MODELRAG_AGENT_RETRIEVAL_MAX_NAVIGATION_ACTIONS:12}
      max-observation-items: ${MODELRAG_AGENT_RETRIEVAL_MAX_OBSERVATION_ITEMS:20}
      max-observation-excerpt-chars: ${MODELRAG_AGENT_RETRIEVAL_MAX_OBSERVATION_EXCERPT_CHARS:500}
      max-policy-context-chars: ${MODELRAG_AGENT_RETRIEVAL_MAX_POLICY_CONTEXT_CHARS:12000}
  ollama:
    enabled: ${MODELRAG_OLLAMA_ENABLED:false}
    url: ${MODELRAG_OLLAMA_URL:${OLLAMA_HOST:127.0.0.1:11434}}
    chat-model: ${MODELRAG_OLLAMA_CHAT_MODEL:deepseek-r1:1.5b}
    canary-model: ${MODELRAG_OLLAMA_CANARY_MODEL:}
    embedding-model: ${MODELRAG_OLLAMA_EMBEDDING_MODEL:Qwen3-Embedding-0.6B}
    embedding-dimensions: 1024
  model:
    canary-percent: 0
  models:
    allowed-hosts: ${MODELRAG_MODEL_ALLOWED_HOSTS:}
  reranker:
    enabled: ${MODELRAG_RERANKER_ENABLED:false}
    url: ${MODELRAG_RERANKER_URL:http://127.0.0.1:18080}
    model: ${MODELRAG_RERANKER_MODEL:configured-reranker-profile}
    remote-timeout-ms: ${MODELRAG_RERANKER_TIMEOUT_MS:30000}
  storage:
    endpoint: ${MODELRAG_S3_ENDPOINT:http://localhost:19000}
    bucket: ${MODELRAG_S3_BUCKET:modelrag}
    region: ${MODELRAG_S3_REGION:us-east-1}
  elasticsearch:
    endpoint: ${MODELRAG_ELASTICSEARCH_ENDPOINT:http://localhost:19200}
    retired-index-retention-hours: ${MODELRAG_ES_RETIRED_INDEX_RETENTION_HOURS:24}
  intent:
    enabled: ${MODELRAG_INTENT_ENABLED:false}
    url: ${MODELRAG_INTENT_URL:http://127.0.0.1:18080}
  eval:
    llm-judge-enabled: ${MODELRAG_EVAL_LLM_JUDGE_ENABLED:false}
    base-commit: ${MODELRAG_EVAL_BASE_COMMIT:unknown}
    full-scale-benchmark-run: ${MODELRAG_EVAL_FULL_SCALE_BENCHMARK_RUN:false}
    quality-regression-tolerance: ${MODELRAG_EVAL_QUALITY_REGRESSION_TOLERANCE:0.0}
    error-rate-tolerance: ${MODELRAG_EVAL_ERROR_RATE_TOLERANCE:0.0}
    degraded-rate-tolerance: ${MODELRAG_EVAL_DEGRADED_RATE_TOLERANCE:0.0}
    benchmark:
      active-retrieval-units: ${MODELRAG_EVAL_BENCHMARK_ACTIVE_RETRIEVAL_UNITS:0}
      active-documents: ${MODELRAG_EVAL_BENCHMARK_ACTIVE_DOCUMENTS:0}
      stale-retrieval-units: ${MODELRAG_EVAL_BENCHMARK_STALE_RETRIEVAL_UNITS:0}
      active-build-count: ${MODELRAG_EVAL_BENCHMARK_ACTIVE_BUILD_COUNT:0}
      active-build-filter-limit: ${MODELRAG_EVAL_BENCHMARK_ACTIVE_BUILD_FILTER_LIMIT:10000}
      no-acl-leakage: ${MODELRAG_EVAL_BENCHMARK_NO_ACL_LEAKAGE:false}
      no-stale-build-leakage: ${MODELRAG_EVAL_BENCHMARK_NO_STALE_BUILD_LEAKAGE:false}
      no-active-build-truncation: ${MODELRAG_EVAL_BENCHMARK_NO_ACTIVE_BUILD_TRUNCATION:false}
      bounded-results: ${MODELRAG_EVAL_BENCHMARK_BOUNDED_RESULTS:false}
      valid-evidence: ${MODELRAG_EVAL_BENCHMARK_VALID_EVIDENCE:false}
  security:
    token-secret: ${MODELRAG_TOKEN_SECRET}
    secret-root-key: ${MODELRAG_SECRET_ROOT_KEY}
    tool-secret-key: ${MODELRAG_TOOL_SECRET_KEY}
    bootstrap-admin-user: ${MODELRAG_BOOTSTRAP_ADMIN_USER:}
    bootstrap-admin-password: ${MODELRAG_BOOTSTRAP_ADMIN_PASSWORD:}
  ingestion:
    max-file-size-bytes: ${MODELRAG_MAX_FILE_SIZE_BYTES:52428800}
    max-pages: ${MODELRAG_MAX_PAGES:1000}
    max-extracted-chars: ${MODELRAG_MAX_EXTRACTED_CHARS:5000000}
    parse-timeout-seconds: ${MODELRAG_PARSE_TIMEOUT_SECONDS:120}
  tools:
    allowed-hosts: ${MODELRAG_TOOL_ALLOWED_HOSTS:}
    allow-http-localhost: false

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - modelrag-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2g

  elasticsearch:
    build:
      context: ./ops/elasticsearch
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "127.0.0.1:19200:9200"
    volumes:
      - modelrag-elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2g

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - modelrag-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 512m

  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - modelrag-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio-init:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MODELRAG_S3_BUCKET: ${MODELRAG_S3_BUCKET:?set MODELRAG_S3_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD
      && mc mb --ignore-existing local/$$MODELRAG_S3_BUCKET
      && mc version enable local/$$MODELRAG_S3_BUCKET"

  backend:
    build:
      context: .
      dockerfile: modelrag-server/Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      MODELRAG_ELASTICSEARCH_ENDPOINT: http://elasticsearch:9200
      MODELRAG_ES_RETIRED_INDEX_RETENTION_HOURS: ${MODELRAG_ES_RETIRED_INDEX_RETENTION_HOURS:-24}
      MODELRAG_S3_ENDPOINT: http://minio:9000
      MODELRAG_S3_BUCKET: ${MODELRAG_S3_BUCKET:?set MODELRAG_S3_BUCKET}
      MODELRAG_S3_REGION: ${MODELRAG_S3_REGION:?set MODELRAG_S3_REGION}
      MODELRAG_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MODELRAG_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MODELRAG_TOKEN_SECRET: ${MODELRAG_TOKEN_SECRET:?set MODELRAG_TOKEN_SECRET}
      MODELRAG_SECRET_ROOT_KEY: ${MODELRAG_SECRET_ROOT_KEY:?set MODELRAG_SECRET_ROOT_KEY}
      MODELRAG_TOOL_SECRET_KEY: ${MODELRAG_TOOL_SECRET_KEY:?set MODELRAG_TOOL_SECRET_KEY}
      # Required only until the first enabled ADMIN has been persisted; the application fails closed otherwise.
      MODELRAG_BOOTSTRAP_ADMIN_USER: ${MODELRAG_BOOTSTRAP_ADMIN_USER:-}
      MODELRAG_BOOTSTRAP_ADMIN_PASSWORD: ${MODELRAG_BOOTSTRAP_ADMIN_PASSWORD:-}
      MODELRAG_OLLAMA_ENABLED: ${MODELRAG_OLLAMA_ENABLED:?set MODELRAG_OLLAMA_ENABLED}
      MODELRAG_OLLAMA_URL: ${MODELRAG_OLLAMA_URL:?set MODELRAG_OLLAMA_URL}
      MODELRAG_OLLAMA_CHAT_MODEL: ${MODELRAG_OLLAMA_CHAT_MODEL:?set MODELRAG_OLLAMA_CHAT_MODEL}
      MODELRAG_OLLAMA_EMBEDDING_MODEL: Qwen3-Embedding-0.6B
      MODELRAG_RERANKER_ENABLED: ${MODELRAG_RERANKER_ENABLED:?set MODELRAG_RERANKER_ENABLED}
      MODELRAG_RERANKER_URL: ${MODELRAG_RERANKER_URL:?set MODELRAG_RERANKER_URL}
      MODELRAG_AGENT_MAX_STEPS: ${MODELRAG_AGENT_MAX_STEPS:?set MODELRAG_AGENT_MAX_STEPS}
      MODELRAG_TOOL_ALLOWED_HOSTS: ${MODELRAG_TOOL_ALLOWED_HOSTS:-}
      MODELRAG_MODEL_ALLOWED_HOSTS: ${MODELRAG_MODEL_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:8091:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 2g

  prometheus:
    image: prom/prometheus:v2.53.1
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    ports:
      - "127.0.0.1:19090:9090"
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/prometheus/rules:/etc/prometheus/rules:ro
      - modelrag-prometheus:/prometheus
    depends_on:
      backend:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - modelrag-grafana:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

  frontend:
    build:
      context: ./modelrag-client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  modelrag-postgres:
  modelrag-elasticsearch:
  modelrag-redis:
  modelrag-minio:
  modelrag-prometheus:
  modelrag-grafana:

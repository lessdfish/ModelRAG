[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "modelrag-ai-service"
version = "0.1.0"
description = "Stateless ModelRAG AI compute plane"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2.8,<3",
  "python-multipart>=0.0.9,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
]
runtime = [
  "sentence-transformers>=5,<7",
  "PyMuPDF>=1.24,<2",
  "python-docx>=1.2,<2",
  "Pillow>=10,<13",
  "pytesseract>=0.3.13,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
